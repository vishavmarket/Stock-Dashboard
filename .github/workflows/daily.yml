name: Daily stock update

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install yfinance pandas numpy

      - name: Run the update
        run: python update.py

      - name: Save results back to GitHub
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add *.csv
          git commit -m "Daily update" || echo "No changes to save"
          git push
